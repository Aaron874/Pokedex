<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="./img/icon.png">
    <script src="./script.js"></script>
    <script src="./templates.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body id="body" onload="init()">

    <header>
        <nav class="navbar bg-body-tertiary content_limit">
            <div class="container-fluid header">
                <div class="header_title">
                    <img class="header_img" src="./img/icon.png" alt="">
                    <h1 class="navbar-brand mb-0 h1">Pokedex</h1>
                </div>
                <div class="search_bar">
                    <div>
                        <div style="display: flex;">
                            <input id="input_field" type="text"><button onclick="showSpinnerAndLoadPokemonSearching()"
                                class="button">search/get back</button>
                            <button class="button-2">search/get back</button>
                        </div>
                        <span id="alert_searchbar" class="alert_searchbar">min. 3 Zeichen eingeben!</span>
                    </div>
                </div>

            </div>
        </nav>
    </header>
    <div>
        <div class="displayflex">
            <div class="content_limit">
                <div class="content" id="content"></div>
                <div class="loadingspinner" id="loadingspinner">
                    <div class="spinner"></div>
                    <span>...loading</span>
                </div>
            </div>
        </div>
        <div class="displayflex">
            <div class="content_limit">
                <div onclick="closeOverlay()" class="overlay" id="overlay">
                    <span onclick="closeOverlay()" class="close_overlay">X</span>
                    <div id="overlay_content"></div>
                </div>
            </div>
        </div>
        <div class="displayflex">
            <div class="content_limit">
                <div class="button_style">
                    <button class="loading_button" onclick="showSpinnerAndLoadMorePokemon()">mehr Pokemon laden</button>
                </div>
            </div>
        </div>
    </div>

    <footer></footer>
</body>

</html>
